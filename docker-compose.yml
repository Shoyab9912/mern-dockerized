services:
  web:
    build:
      context: frontend
      args:
        VITE_API_URL: /api
    expose:
      - "80"

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
    ports:
      - "${PORT}:${PORT}"
    restart: always
  nginx:
    image: nginx:stable-alpine3.24
    ports:
      - "80:80"
    volumes:
       - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
